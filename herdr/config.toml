onboarding = false
# megan's herdr config, installed to ~/.config/herdr/config.toml by `make -C herdr install`.
#
# Keymap: herdr's built-in defaults with the prefix moved to ctrl+space. lucy
# (jds_config_omarchy/herdr/config.toml) uses the same [keys] block, so muscle
# memory is identical on both machines. This file's keys also drive
# `herdr --remote lucy` attaches, which use the client's local keybindings.
# Keep the two [keys] blocks in sync. `herdr --default-config` lists every
# default binding.
#
# ctrl+space is free on macOS here: the input-source shortcuts that default to
# it are disabled in System Settings.

[keys]
prefix = "ctrl+space"

# herdr-file-viewer plugin (`make -C herdr plugins` installs it)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[theme]
# Matches Ghostty's Catppuccin Mocha
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "symbols"

[ui.toast]
# macOS Notification Center
delivery = "system"

[ui.sidebar.spaces]
# rows = [["state_icon", "workspace"], ["branch", "git_status"]]
rows = [["state_icon", "workspace"]]
